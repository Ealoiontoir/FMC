<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Between Paper and Word</title><style>
:root{color-scheme:light;--ink:#233b3f;--muted:#617379;--line:#ccd7d4}*{box-sizing:border-box}body{margin:0;background:#f7f6f1;color:var(--ink);font:16px/1.6 system-ui,sans-serif}.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 10%,#dde9f3aa,transparent 55%),radial-gradient(ellipse at 90% 85%,#eedddc80,transparent 55%)}.card{width:min(100%,510px);padding:42px;background:#ffffffd9;border:1px solid var(--line);border-top:4px solid #4b81a5;border-radius:8px;box-shadow:0 12px 36px #233b3f09}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}h1{font:44px/1.1 Georgia,serif;margin:15px 0 20px}p{color:var(--muted)}label{display:block;font-weight:600;margin:28px 0 8px}input{width:100%;padding:13px;border:1px solid #9bafb5;border-radius:4px;font:18px system-ui;letter-spacing:.04em}button{padding:12px 18px;border:0;border-radius:4px;background:#29434a;color:white;font:600 15px system-ui;cursor:pointer;margin-top:14px}button:disabled{opacity:.6;cursor:wait}input:focus,button:focus-visible{outline:3px solid #a7c9e4;outline-offset:2px}#status{min-height:48px;font-size:14px;margin-bottom:0}.note{font-size:12px;margin-top:18px}#viewer{display:none;border:0;width:100%;height:100dvh;background:white}#lock{display:none;position:fixed;right:14px;bottom:14px;z-index:10;box-shadow:0 2px 12px #0002}body.open .gate{display:none}body.open #viewer,body.open #lock{display:block}body.open{overflow:hidden}@media(max-width:500px){.card{padding:28px}h1{font-size:36px}}
</style></head><body><main class="gate" id="gate"><section class="card"><div class="eyebrow">Private study link</div><h1>Between Paper<br>and Word</h1><p>An illustrated letter · Русский / English / Nederlands.<br>Enter the access code shared with you to open it.</p><form id="unlock"><label for="code">Access code</label><input id="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" required><button id="open" type="submit">Open the letter</button><p id="status" role="status" aria-live="polite"></p></form><p class="note">The code unlocks the letter in this browser. It is not saved between visits.</p></section></main><iframe id="viewer" title="Between Paper and Word study atlas"></iframe><button id="lock" type="button">Lock letter</button><script id="gate-config" type="application/json">{"salt":"/J6xvaCIGLcm17myohPjVg==","iv":"CXdagj0AinHva/fn","checkIv":"fY/eDMZv6TcyYCsk","check":"FigZdHfaXuu5tSVje3x5h2Q4NZZ8IYB2Gz5Yygg7","iterations":600000,"parts":[{"name":"letter.bin","bytes":8141316,"sha256":"6bee22fac7a617cb21d298b0d5e2acb69f8ca86fdb2b388ee520836271875ef6"}]}</script><script>
(()=>{const CONFIG=JSON.parse(document.getElementById('gate-config').textContent),form=document.getElementById('unlock'),field=document.getElementById('code'),status=document.getElementById('status'),button=document.getElementById('open'),viewer=document.getElementById('viewer');let objectUrl;
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function accessKey(code){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(CONFIG.salt),iterations:CONFIG.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Checking the access code…';try{if(!crypto.subtle)throw Error('HTTPS');let key;try{key=await accessKey(field.value.trim());await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(CONFIG.checkIv)},key,bytes(CONFIG.check));}catch(err){if(err.message==='HTTPS')throw err;throw Error('CODE');}field.value='';status.textContent='Loading the encrypted letter…';const blobs=[];let done=0,total=CONFIG.parts.reduce((s,p)=>s+p.bytes,0);for(const part of CONFIG.parts){const response=await fetch(part.name);if(!response.ok)throw Error('LOAD');const buffer=new Uint8Array(await response.arrayBuffer());if(buffer.length!==part.bytes)throw Error('LOAD');const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer)),n=>n.toString(16).padStart(2,'0')).join('');if(digest!==part.sha256)throw Error('LOAD');blobs.push(buffer);done+=buffer.length;status.textContent='Loading the encrypted letter… '+Math.round(done/total*100)+'%';}const combined=new Uint8Array(total);let offset=0;for(const b of blobs){combined.set(b,offset);offset+=b.length;}const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(CONFIG.iv)},key,combined);const fullPage=new TextDecoder().decode(clear);document.open();document.write(fullPage);document.close();}catch(err){status.textContent=err.message==='CODE'?'The code did not match. Please check it and try again.':err.message==='HTTPS'?'Open this page using its secure HTTPS website address.':'The letter could not load. Please check the connection and try again.';}finally{button.disabled=false;}});
document.getElementById('lock').addEventListener('click',()=>{viewer.src='about:blank';if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=undefined;document.body.classList.remove('open');field.value='';field.focus();});
})();
</script></body></html>
